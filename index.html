<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Selvi — Offline AI Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1 id="assistantName">Selvi</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Open settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="composer" class="composer">
      <button type="button" id="micBtn" class="icon-btn mic" aria-label="Voice input">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4"/>
        </svg>
      </button>
      <input id="input" type="text" placeholder="Type a message…" autocomplete="off" />
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

  <div id="settingsPanel" class="settings-overlay hidden">
    <div class="settings-card">
      <div class="settings-head">
        <h2>Settings</h2>
        <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="Close settings">✕</button>
      </div>

      <label class="row">
        <span>Web search</span>
        <input type="checkbox" id="searchToggle" />
      </label>
      <p class="hint" id="searchHint">Checking…</p>

      <label class="row">
        <span>Speak replies aloud</span>
        <input type="checkbox" id="voiceToggle" checked />
      </label>

      <label class="row column">
        <span>Voice</span>
        <select id="voiceSelect"></select>
      </label>
      <p class="hint">Voice output can be fully offline. Tap the mic to talk — most phone browsers send that audio to a cloud speech service, so skip it if you need strict offline-only use.</p>

      <button id="clearChatBtn" class="danger-btn" type="button">Clear conversation</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
