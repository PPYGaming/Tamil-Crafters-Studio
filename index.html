<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TamilCrafters Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
      font-size: 15px;
    }

    .link {
      display: block;
      text-decoration: none;
      color: white;
      background: #252932;
      margin: 14px 0;
      padding: 17px 20px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: bold;
      border: 1px solid #353a45;
      transition: 0.2s;
    }

    .link:hover {
      background: #343a46;
      transform: scale(1.02);
    }

    .forge {
      border-left: 4px solid #f28c28;
    }

    .discord {
      border-left: 4px solid #5865F2;
    }

    .whatsapp {
      border-left: 4px solid #25D366;
    }

    .realm {
      border-left: 4px solid #55c878;
    }

    .footer {
      margin-top: 28px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      🛠️
    </div>

    <h1>TamilCrafters Studio</h1>

    <p class="subtitle">
      Minecraft Bedrock • Community • Addons
    </p>

    <a class="link forge"
       href="https://www.curseforge.com/members/tamil_crafters/projects"
       target="_blank">
      ⚙️ CurseForge Projects
    </a>

    <a class="link discord"
       href="https://discord.gg/jSSPdKwEjb"
       target="_blank">
      💬 MC Tamil Community
    </a>

    <a class="link discord"
       href="https://discord.gg/2bqKNwFZ9N"
       target="_blank">
      💬 TamilCrafters Discord
    </a>

    <a class="link whatsapp"
       href="https://chat.whatsapp.com/Lg34P35MKhA582bAGE9n7K?s=cl&p=a&mlu=4"
       target="_blank">
      📱 WhatsApp Community
    </a>

    <a class="link realm"
       href="https://realms.gg/Tfs3AWPWJKE9gxc"
       target="_blank">
      🌐 TamilCrafters Realm
    </a>

    <div class="footer">
      © 2026 TamilCrafters Studio
    </div>

  </div>

</body>
</html>
